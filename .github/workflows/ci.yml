name: CI

on:
  push:
    branches: [main]
  pull_request:

# a new push to a pull request replaces its run; each run on main has its own group,
# since a group keeps only one pending run and would drop the others
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
        # every Python on one OS; other OSes only at the oldest and newest Python, since
        # what differs by OS doesn't depend on the version (and macOS runners are few)
        include:
          - os: macos-latest
            python: "3.9"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: pytest -q
