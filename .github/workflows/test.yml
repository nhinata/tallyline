name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# a new push to a pull request replaces its run; each run on main has its own group,
# since a group keeps only one pending run and would drop the others
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # every Python on one OS; other OSes only at the oldest and newest Python, since
        # what differs by OS doesn't depend on the version (and macOS runners are few)
        include:
          # setup-python has no Python 3.9 for Ubuntu 26.04, which ubuntu-latest now is
          - os: ubuntu-24.04
            python: "3.9"
          - os: macos-latest
            python: "3.9"
          - os: macos-latest
            python: "3.14"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e . pytest
      - run: pytest -q
