name: Release

# Publishes to PyPI via trusted publishing (no API token stored in the repo).
# - Pushing a tag like v0.2.0 releases that version. The first release is always made
#   this way.
# - A merge to main that changes prices.json releases the next patch version, but only
#   once a first release exists; before that it does nothing.
# - After the build and right before publishing, a GitHub Release with generated notes
#   is created for the tag unless one already exists. If publishing then fails, that
#   Release remains for a version not on PyPI; delete it by hand.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["src/tallyline/prices.json"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag next patch version
        id: version
        if: github.ref_type == 'branch'
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            echo "No release yet; push a tag like v0.1.0 to make the first one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          next="v${major}.${minor}.$((patch + 1))"
          git tag "$next"
          git push origin "$next"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.version.outputs.skip != 'true'
        with:
          python-version: "3.13"
      - if: steps.version.outputs.skip != 'true'
        run: pip install build pytest && pip install -e . && pytest -q
      - if: steps.version.outputs.skip != 'true'
        run: python -m build
      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag || github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --verify-tag --generate-notes
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        if: steps.version.outputs.skip != 'true'
