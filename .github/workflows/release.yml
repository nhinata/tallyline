name: Release

# Publishes to PyPI via trusted publishing (no API token stored in the repo).
# - Pushing a tag like v0.2.0 releases that version. The first release is always made
#   this way.
# - A merge to main that changes prices.json releases the next patch version, but only
#   once a first release exists; before that it does nothing.
on:
  push:
    tags: ["v*"]
    branches: [main]
    paths: ["src/tallyline/prices.json"]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag next patch version
        id: version
        if: github.ref_type == 'branch'
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [ -z "$last" ]; then
            echo "No release yet; push a tag like v0.1.0 to make the first one."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          IFS=. read -r major minor patch <<< "${last#v}"
          next="v${major}.${minor}.$((patch + 1))"
          git tag "$next"
          git push origin "$next"
      - uses: actions/setup-python@v5
        if: steps.version.outputs.skip != 'true'
        with:
          python-version: "3.13"
      - if: steps.version.outputs.skip != 'true'
        run: pip install build pytest && pip install -e . && pytest -q
      - if: steps.version.outputs.skip != 'true'
        run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: steps.version.outputs.skip != 'true'
