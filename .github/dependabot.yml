version: 2
updates:
  # tallyline has no dependencies to install; only the actions in the workflows.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Wait three days after a release: compromised releases are usually found
    # and removed within hours or days. Three days is also Dependabot's default.
    cooldown:
      default-days: 3
    # Majors come one by one: they can break the workflow.
    groups:
      actions:
        patterns: ['*']
        update-types: [minor, patch]
    commit-message:
      prefix: ci
